html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.55; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel2); }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.seg button:focus-visible, .tabs button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.top .spacer { flex: 1; }
.dchip { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 4px 8px; border: 1px dashed var(--line); border-radius: 6px; }

nav.tabs { display: flex; gap: 2px; overflow-x: auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { flex: none; border: 0; background: none; padding: 10px 12px 9px; cursor: pointer; color: var(--muted); font-size: 13.5px; border-bottom: 2px solid transparent; white-space: nowrap; }

  /* ---------- derived cost model per cell (Input -> unit economics) ---------- */
  function unitEconomics(cell, C, surge = 1) {
    const T = cell.T, d = cell.dSt;
    const tmV = km => km * 1.3 / C.dsp.speed * 60, tmC = km => km * 1.3 / C.flex.speed * 60, tmM = km => km * 1.3 / C.moto.speed * 60;
    const mppVan = (T.van[0] + T.pps * T.perPkg + T.van[1]) / T.pps;
    const mppCar = (T.car[0] + T.pps * T.perPkg + T.car[1]) / T.pps / C.flex.eff;
    const mppMoto = (2 + T.pps * T.perPkg * 0.9 + 1.8) / T.pps;
    const routeMin = C.dsp.shift - C.dsp.overhead - 2 * tmV(d);
    const pkgRoute = clamp(routeMin / mppVan, 10, C.dsp.cap);
    const blockMin = C.flex.hours * 60 - C.flex.overhead - 2 * tmC(d);
    const pkgBlock = clamp(blockMin / mppCar, 4, C.flex.cap);
    const trip = 2 * tmM(d) + C.moto.tripCap * mppMoto;
    const trips = Math.max(1, Math.floor((C.moto.hours * 60 - C.moto.overhead) / trip));
    const pkgMoto = trips * C.moto.tripCap;
    return {
      mppVan, mppCar, mppMoto, pkgRoute, pkgBlock, pkgMoto,
      cppDSP: C.dsp.route / pkgRoute + C.dsp.varPkg,
      cppFlex: C.flex.block * surge / pkgBlock + C.dsp.varPkg,
      cppMoto: C.moto.shift / pkgMoto + C.dsp.varPkg,
      breakeven: C.dsp.route / (C.flex.block * surge / pkgBlock), // packages a van must carry to beat Flex
      travelMin: tmV(d),
    };
  }

  /* ---------- build the city state from geography ---------- */
  function build(GEO, cityKey, overrides = {}) {
    const G = GEO[cityKey];
    const C0 = COUNTRY[cityKey];
    const C = JSON.parse(JSON.stringify(C0.cost));
    for (const [path, v] of Object.entries(overrides)) {
      const [a, b] = path.split('.');
      if (b != null && C[a] && typeof C[a] === 'object' && b in C[a]) C[a][b] = v;
      else if (b == null && a in C && typeof C[a] !== 'object') C[a] = v;
    }
    const types = C0.types;
    const stations = G.stations.map((s, i) => ({ ...s, i }));
    const anchors = Object.fromEntries(G.anchors.map(a => [a.name, a]));
    const cells = G.cells.map((c, i) => {
      const a = anchors[c.anchor];
      const T = types[a.type] || Object.values(types)[0];
      let st = 0, bd = 1e9; stations.forEach((s, j) => { const dd = km(c, s); if (dd < bd) { bd = dd; st = j; } });
      return { ...c, i, type: a.type, T, name: c.anchor, w: a.w, station: st, dSt: Math.max(1.5, bd) };
    });
    // volume base: type volume x anchor weight x distance decay x land area, scaled to the city total
    const r0 = rng(hash(cityKey, 'base'));
    cells.forEach(c => { c.base0 = c.T.vol * c.w * Math.exp(-c.dist / 4.0) * (c.area / 5.16) * (0.85 + 0.3 * r0()); });
    const scale = C0.totalDaily / sum(cells.map(c => c.base0));
    cells.forEach(c => { c.base = c.base0 * scale; });
    // Flex clusters: group each station's cells into compact clusters of about eight cells
    const clusters = [];
    stations.forEach(s => {
      const own = cells.filter(c => c.station === s.i);
      const k = Math.max(1, Math.round(own.length / 8));
      own.sort((a, b) => Math.atan2(a.lat - s.lat, a.lng - s.lng) - Math.atan2(b.lat - s.lat, b.lng - s.lng));
      for (let j = 0; j < k; j++) {
        const part = own.slice(Math.floor(j * own.length / k), Math.floor((j + 1) * own.length / k));
        const id = clusters.length;
        part.forEach(c => c.cluster = id);
        clusters.push({ id, station: s.i, cells: part.map(c => c.i), name: `${s.name.split(' ')[0]}-F${j + 1}` });
      }
    });
    const S = { cityKey, G, C0, C, types, stations, cells, clusters, wd: C0.wd };
    genHistory(S);
    return S;
  }

  /* ---------- Input layer: synthetic accumulated records (tier 1 summarised into tier 2) ---------- */
  function truthVolume(S, c, t, mult = 1) {
    const r = rng(hash(S.cityKey, c.id, t, 'v'));
    const T = c.T, ev = EVENTS[t] ? EVENTS[t].mult : 1;
    const growth = Math.pow(1 + T.trend, (t - D) / 7);
    const noise = Math.exp(T.cv * gauss(r) - T.cv * T.cv / 2);
    const tot = c.base * S.wd[dow(t)] * growth * noise * ev * mult;
    const jit = k => Math.exp(0.22 * gauss(r) - 0.024);
    const mixT = T.mix.map((m, k) => m * (k < 2 ? jit(k) : 1));
    const ms = sum(mixT);
    return { tot, byPromise: mixT.map(m => tot * m / ms) };
  }
  function genHistory(S) {
    const { cells, C } = S;
    S.hist = cells.map(c => {
      const rows = [];
      const ue = unitEconomics(c, C);
      for (let t = 0; t < HIST; t++) {
        const r = rng(hash(S.cityKey, c.id, t, 'h'));
        const v = truthVolume(S, c, t);
        const T = c.T;
        const pk = v.byPromise.map(Math.round);
        const tot = sum(pk);
        const dsp = Math.round((pk[2] + pk[3]) * clamp(0.97 + 0.03 * gauss(r), 0.85, 1));
        const moto = Math.round(pk[0] * T.small);
        const nhW = T.nh.map(x => x / 100 * (1 + 0.15 * gauss(r)));
        const nhAvg = 0.3 * nhW[0] + 0.3 * nhW[1] + 0.25 * nhW[2] + 0.15 * nhW[3]; // today's window mix (earliest first)
        const fas = clamp(1 - nhAvg - T.addrFail - (T.cod * C.codRefusal) + 0.002 * gauss(r), 0.5, 0.999);
        rows.push({
          t, event: !!EVENTS[t], tot, pk, dsp, flex: tot - dsp - moto, moto,
          stops: Math.round(tot / T.pps),
          dwell: (T.van[0] + T.pps * T.perPkg) * (1 + 0.06 * gauss(r)),
          pph: 60 / ue.mppVan * (1 + 0.05 * gauss(r)),
          fas, nhW, addr: T.addr * (1 + 0.1 * gauss(r)),
          cppDSP: ue.cppDSP * (1 + 0.04 * gauss(r)), cppFlex: ue.cppFlex * (1 + 0.05 * gauss(r)),
        });
      }
      return rows;
    });
  }

  /* ---------- PLAN layer (weekly): zone profile, scores, archetype, primary/backup, DSP baseline ---------- */
  function plan(S, opt = {}) {
    const { cells, C, hist } = S;
    const z = opt.z ?? 0.5;
    const prof = cells.map((c, i) => {
      const rows = hist[i].filter(r => !r.event && r.t >= HIST - 56);
      const de = rows.map(r => r.tot / S.wd[dow(r.t)]);
      const m = mean(de), s = sd(de);
      const last4 = mean(rows.filter(r => r.t >= HIST - 28).map(r => r.tot / S.wd[dow(r.t)]));
      const prev4 = mean(rows.filter(r => r.t < HIST - 28).map(r => r.tot / S.wd[dow(r.t)]));
      const tots = rows.map(r => r.tot);
      const pkS = [0, 1, 2, 3].map(k => sum(rows.map(r => r.pk[k])));
      const all = sum(pkS);
      return {
        i, mean: m, sd: s, cv: s / m, p10: quantile(de, 0.1), growth: last4 / prev4 - 1,
        meanRaw: mean(tots),
        share: pkS.map(x => x / all), sameday: (pkS[0] + pkS[1]) / all, h2: pkS[0] / all,
        dwell: mean(rows.map(r => r.dwell)), pph: mean(rows.map(r => r.pph)), fas: mean(rows.map(r => r.fas)),
        addr: mean(rows.map(r => r.addr)), nhW: [0, 1, 2, 3].map(k => mean(rows.map(r => r.nhW[k]))),
        curDSP: sum(rows.map(r => r.dsp)) / sum(tots), curFlex: sum(rows.map(r => r.flex)) / sum(tots),
        series: hist[i].map(r => ({ t: r.t, v: r.tot, ev: r.event })),
      };
    });
    // scores: percentile within the country
    const col = k => prof.map(p => p[k]);
    const A = { pph: col('pph'), dwell: col('dwell'), cv: col('cv'), sameday: col('sameday'), fas: col('fas'), addr: col('addr') };
    prof.forEach(p => {
      p.sc = {
        density: Math.round(100 * pctRank(A.pph, p.pph)),
        difficulty: Math.round(100 * pctRank(A.dwell, p.dwell)),
        predictability: Math.round(100 * (1 - pctRank(A.cv, p.cv))),
        urgency: Math.round(100 * pctRank(A.sameday, p.sameday)),
        reliability: Math.round(100 * (pctRank(A.fas, p.fas) + 1 - pctRank(A.addr, p.addr)) / 2),
      };
    });
    archetypes(S, prof);
    // unit economics with Flex supply feedback: iterate so surge reflects the Flex volume the plan itself creates
    let surge = S.stations.map(() => 1);
    for (let it = 0; it < 5; it++) {
      const flexBlocks = S.stations.map(() => 0);
      prof.forEach((p, i) => {
        const c = cells[i];
        p.ue = unitEconomics(c, C, surge[c.station]);
        decideCell(S, p, c, z);
        flexBlocks[c.station] += p.mean * S.wd[1] * p.rec.flex / p.ue.pkgBlock;
      });
      const next = flexBlocks.map(b => surgeOf(C, b / C.flex.poolPerStation));
      surge = surge.map((s, k) => 0.5 * s + 0.5 * next[k]);
    }
    S.planSurge = surge;
    S.prof = prof;
    // station summaries
    S.planStations = S.stations.map(s => {
      const ps = prof.filter(p => cells[p.i].station === s.i);
      const vol = sum(ps.map(p => p.mean));
      return {
        i: s.i, name: s.name, vol, surge: surge[s.i],
        recDSP: sum(ps.map(p => p.mean * p.rec.dsp)) / vol, recFlex: sum(ps.map(p => p.mean * p.rec.flex)) / vol, recMoto: sum(ps.map(p => p.mean * p.rec.moto)) / vol,
        curDSP: sum(ps.map(p => p.mean * p.curDSP)) / vol,
        flexBlocks: sum(ps.map(p => p.mean * p.rec.flex / p.ue.pkgBlock)), pool: C.flex.poolPerStation,
      };
    });
    const vol = sum(prof.map(p => p.mean));
    S.planTotals = {
      vol, recDSP: sum(prof.map(p => p.mean * p.rec.dsp)) / vol, recFlex: sum(prof.map(p => p.mean * p.rec.flex)) / vol,
      recMoto: sum(prof.map(p => p.mean * p.rec.moto)) / vol, curDSP: sum(prof.map(p => p.mean * p.curDSP)) / vol,
    };
    return prof;
  }
  function surgeOf(C, util) { return clamp(1 + C.flex.surgeK * Math.max(0, util - 0.85), 1, C.flex.surgeCap); }

  function decideCell(S, p, c, z) {
    const C = S.C, ue = p.ue;
    // primary channel for packages that DSP can carry (next day and standard)
    p.primary = ue.cppDSP <= flexEff(S, ue, (ue.cppFlex - C.dsp.varPkg) * ue.pkgBlock / C.flex.block) ? 'DSP' : 'Flex';
    p.backup = p.primary === 'DSP' ? 'Flex' : 'DSP';
    // newsvendor: commit DSP slots up to the critical fractile of the D-7 forecast of DSP eligible volume
    ue.cppFlexEff = flexEff(S, ue, ue.cppFlex > 0 ? (ue.cppFlex - C.dsp.varPkg) * ue.pkgBlock / C.flex.block : 1);
    ue.breakevenEff = C.dsp.route / Math.max(0.01, ue.cppFlexEff - C.dsp.varPkg);
    const cOver = ue.cppFlexEff * (1 + 0.5 * C.flex.instantPremium); // overflow mostly lands in scheduled blocks
    p.cr = clamp(1 - ue.cppDSP / cOver, 0, 0.99);
    const elig = p.share[2] + p.share[3];
    p.elig = elig;
    const sigmaElig = Math.max(p.cv, 0.03);
    p.z = p.cr > 0 ? normInv(p.cr) : -Infinity;
    const slotRatio = p.cr > 0 ? clamp(1 + p.z * sigmaElig, 0, 1.3) : 0; // as a ratio of mean eligible volume
    const floorR = p.primary === 'Flex' ? C.dsp.backupFloor : 0;
    p.slotRatio = Math.max(slotRatio, floorR / Math.max(elig, 0.01));
    p.rec = {
      dsp: Math.min(elig * Math.min(p.slotRatio, 1), elig),
      moto: p.h2 * c.T.small,
    };
    p.rec.flex = Math.max(0, 1 - p.rec.dsp - p.rec.moto);
    p.gap = p.rec.dsp - p.curDSP;
    // simple daily saving estimate vs current split (per cell)
    const dayVol = p.mean * S.wd[1];
    const curCost = dayVol * (p.curDSP * ue.cppDSP + (1 - p.curDSP - p.rec.moto) * ue.cppFlexEff + p.rec.moto * ue.cppMoto);
    const recCost = dayVol * (p.rec.dsp * ue.cppDSP + p.rec.flex * ue.cppFlexEff + p.rec.moto * ue.cppMoto);
    p.saving = curCost - recCost;
  }

  function archetypes(S, prof) {
    // k-means (k=4) on the five scores, deterministic k-means++ seeding
    const X = prof.map(p => [p.sc.density, p.sc.difficulty, p.sc.predictability, p.sc.urgency, p.sc.reliability]);
    const k = 4, r = rng(hash(S.cityKey, 'km'));
    const dist2 = (a, b) => a.reduce((s, x, j) => s + (x - b[j]) ** 2, 0);
    const cents = [X[Math.floor(r() * X.length)]];
    while (cents.length < k) {
      const d = X.map(x => Math.min(...cents.map(c => dist2(x, c))));
      let u = r() * sum(d), j = 0; while (u > d[j]) { u -= d[j]; j++; }
      cents.push(X[Math.min(j, X.length - 1)]);
    }
    let lab = X.map(() => 0);
    for (let it = 0; it < 40; it++) {
      lab = X.map(x => { let b = 0, bd = 1e18; cents.forEach((c, j) => { const dd = dist2(x, c); if (dd < bd) { bd = dd; b = j; } }); return b; });
      for (let j = 0; j < k; j++) { const m = X.filter((_, q) => lab[q] === j); if (m.length) cents[j] = m[0].map((_, d) => mean(m.map(x => x[d]))); }
    }
    // name clusters by their centroid, unique names
    const order = cents.map((c, j) => ({ j, c }));
    const names = {};
    const take = (fn, name) => { const left = order.filter(o => !(o.j in names)); if (!left.length) return; left.sort((a, b) => fn(b.c) - fn(a.c)); names[left[0].j] = name; };
    take(c => c[1] + c[3] - c[0], '고밀도 긴급형');
    take(c => c[2] - c[1] + c[0], '안정적 교외형');
    take(c => -c[4], '실패 위험형');
    take(() => 0, '혼합 중밀도형');
    const ARCH = { '고밀도 긴급형': 'A', '안정적 교외형': 'B', '실패 위험형': 'C', '혼합 중밀도형': 'D' };
    prof.forEach((p, q) => { p.arch = names[lab[q]]; p.archKey = ARCH[p.arch]; p.growing = p.growth >= 0.08; });
    S.archCentroids = cents.map((c, j) => ({ name: names[j], key: ARCH[names[j]], c: c.map(Math.round), n: lab.filter(x => x === j).length }));
  }

  /* ---------- PREPARE layer (D-7 commit, D-1 adjust): forecast, DSP routes, Flex blocks, moto ---------- */
  function forecast(S, i, h, mult = 1) {
    // level from the 28 days before the information cut-off, weekday adjusted, with damped trend
    const cut = D - h; // information up to day cut-1
    const rows = S.hist[i].filter(r => !r.event && r.t < cut && r.t >= cut - 28);
    const de = rows.map(r => r.tot / S.wd[dow(r.t)]);
    const a = mean(de.slice(0, 14)), b = mean(de.slice(14));
    const g = clamp(Math.pow(b / a, 1 / 2) - 1, -0.06, 0.06);
    const level = mean(de) * Math.pow(1 + g, 14 / 7 / 1);
    const f = level * Math.pow(1 + g, (h + 7) / 7) * S.wd[dow(D)] * mult;
    // error band from a quick backtest over the last 21 days at the same horizon
    const errs = [];
    for (let t = cut - 21; t < cut; t++) {
      const rr = S.hist[i].filter(r => !r.event && r.t < t - h + 1 && r.t >= t - h + 1 - 28);
      if (rr.length < 10 || S.hist[i][t].event) continue;
      const lv = mean(rr.map(r => r.tot / S.wd[dow(r.t)]));
      errs.push(Math.log(S.hist[i][t].tot / (lv * S.wd[dow(t)])));
    }
    const sigma = Math.max(0.03, sd(errs));
    return { f, sigma, g };
  }

  function prepare(S, opt = {}) {
    const { cells, C, prof } = S;
    const mult = opt.mult || 1;
    const z = opt.z ?? 0.3;
    const lev = opt.levers || {};
    const peak = mult > 1.2;
    const W = winList(peak && lev.L4);
    const poolOf = () => C.flex.poolPerStation * (peak && lev.L2 ? 2.0 : 1);
    const base = cells.map((c, i) => {
      const p = prof[i];
      const f7 = forecast(S, i, 7, mult), f1 = forecast(S, i, 1, mult);
      const truth = truthVolume(S, c, D, mult);
      // demand shaping (L3) is a planned campaign, so the plan already knows its effect on next day and standard volume
      const kND = peak && lev.L3 ? 0.85 : 1, kST = peak && lev.L3 ? 0.65 : 1;
      const eligShare = p.share[2] * kND + p.share[3] * kST;
      return { i, f7: f7.f, s7: f7.sigma, f1: f1.f, s1: f1.sigma, g: f7.g, truth: truth.tot, truthBy: truth.byPromise,
        elig7: f7.f * eligShare, eligKnown: truth.byPromise[2] * kND + truth.byPromise[3] * kST, sameF: f1.f * (p.share[0] + p.share[1]) };
    });
    // Flex availability feeds back into the DSP commitment: iterate until the surge estimate settles
    let sEst = S.stations.map((s, k) => (S.planSurge ? S.planSurge[k] : 1) * (peak ? 1.3 : 1));
    let out;
    for (let it = 0; it < 4; it++) {
      out = { mult, z, W, cells: [], stations: [], iter: it + 1 };
      base.forEach(x => {
        const p = prof[x.i], c = cells[x.i];
        const cFlex = flexEff(S, p.ue, sEst[c.station] * (peak && lev.L2 ? 1.1 : 1));
        const cDSP = p.ue.cppDSP * (peak && lev.L1 ? 1.1 : 1);
        const cr = clamp(1 - cDSP / (cFlex * (1 + 0.5 * C.flex.instantPremium)), 0, 0.99);
        const zz = cr > 0 ? normInv(cr) : -Infinity;
        let slots7 = cr > 0 ? Math.max(0, x.elig7 * Math.exp(zz * x.s7)) : 0;
        const prim = cDSP <= cFlex ? 'DSP' : 'Flex';
        if (prim === 'Flex') slots7 = Math.max(slots7, x.elig7 * C.dsp.backupFloor);
        slots7 = Math.min(slots7, x.elig7 * 1.25);
        out.cells.push({ ...x, slots7, cr, prim, cFlex, cDSP });
      });
      // D-7: build DSP routes on committed slots per station -> committed route count
      S.stations.forEach(s => {
        const own = out.cells.filter(x => cells[x.i].station === s.i);
        const r7 = buildRoutes(S, s, own.map(x => ({ i: x.i, q: x.slots7 })), Infinity);
        const st = { i: s.i, R7: r7.routes.length, routes7: r7.routes, tempRoutes: 0 };
        st.Rmax = Math.ceil(st.R7 * (1 + C.dsp.band));
        st.Rmin = Math.floor(st.R7 * (1 - C.dsp.band));
        // peak without pre-contracted temporary routes: DSP cannot grow beyond its normal fleet
        // peak: without pre-contracted temporary routes DSP partners can stretch about 25%; with them up to 80%
        if (peak) { const normal = S.normalR ? S.normalR[s.i] : st.R7 / mult; st.Rmax = Math.min(st.Rmax, Math.ceil(normal * (lev.L1 ? 1.8 : 1.25))); st.Rmin = Math.min(st.Rmin, st.Rmax); }
        out.stations.push(st);
      });
      // D-1 night: next day and standard orders are known; adjust DSP within the band
      out.stations.forEach(st => {
        const s = S.stations[st.i];
        const own = out.cells.filter(x => cells[x.i].station === s.i);
        const q1 = own.map(x => ({ i: x.i, q: Math.min(x.eligKnown, x.slots7 * 1.1 + (x.prim === 'DSP' ? x.eligKnown * 0.05 : 0)) }));
        const r1 = buildRoutes(S, s, q1, st.Rmax);
        st.routes = r1.routes; st.served = r1.served; st.R1 = r1.routes.length;
        st.paidRoutes = Math.max(st.R1, st.Rmin);
        if (peak && lev.L1) { const normal = S.normalR ? S.normalR[s.i] : Math.round(st.R7 / mult); st.tempRoutes = Math.max(0, st.paidRoutes - normal); }
      });
      // Flex scheduled blocks by cluster and window
      out.flex = S.clusters.map(cl => {
        const need = W.map(() => 0);
        let pkgBlock = 0, wsum = 0;
        cl.cells.forEach(i => {
          const x = out.cells[i], p = prof[i], c = cells[i];
          const servedDSP = out.stations[c.station].served[i] || 0;
          const overflow = Math.max(0, x.eligKnown - servedDSP);
          const pref = windowPrefs(p, W, c);
          const motoPart = (p.share[0] / Math.max(p.share[0] + p.share[1], 1e-6)) * c.T.small * 0.9;
          const sameFlex = x.sameF * (1 - motoPart);
          W.forEach((w, k) => { need[k] += overflow * pref.nd[k] + sameFlex * pref.sd[k]; });
          pkgBlock += p.ue.pkgBlock * (overflow + sameFlex); wsum += overflow + sameFlex;
        });
        pkgBlock = wsum ? pkgBlock / wsum : C.flex.cap * 0.8;
        const sig = 0.18; // same day forecast error at D-1
        const blocks = need.map(n => n > 0.5 ? Math.ceil(n * Math.exp(z * sig) / pkgBlock) : 0);
        return { id: cl.id, station: cl.station, need, blocks, pkgBlock, W };
      });
      // drivers are not unlimited in any one window: cap each window at 40% of the station pool, spill to the next best window
      S.stations.forEach(s => {
        const fl = out.flex.filter(f => f.station === s.i);
        const cap = 0.4 * poolOf();
        for (let k = W.length - 1; k >= 0; k--) {
          const tot = sum(fl.map(f => f.blocks[k]));
          if (tot <= cap) continue;
          const keep = cap / tot;
          fl.forEach(f => { const moved = f.blocks[k] - Math.floor(f.blocks[k] * keep); f.blocks[k] -= moved; const to = k > 0 ? k - 1 : Math.min(W.length - 1, k + 1); f.blocks[to] += moved; });
        }
      });
      // Flex supply: pool per station (lever L2 raises the pool with incentives)
      const nextS = [];
      out.stations.forEach(st => {
        const sched = sum(out.flex.filter(f => f.station === st.i).map(f => sum(f.blocks)));
        st.flexSched = sched; st.pool = poolOf(); st.util7 = sched / st.pool;
        st.surge7 = surgeOf(C, st.util7) * (peak && lev.L2 ? 1.1 : 1);
        nextS.push(surgeOf(C, st.util7));
      });
      sEst = sEst.map((v, k) => 0.4 * v + 0.6 * nextS[k]);
    }
    // moto shifts for two hour volume
    out.stations.forEach(st => {
      const own = out.cells.filter(x => cells[x.i].station === st.i);
      const h2 = sum(own.map(x => x.f1 * prof[x.i].share[0] * cells[x.i].T.small));
      const per = mean(own.map(x => prof[x.i].ue.pkgMoto)) || 20;
      st.motoShifts = Math.ceil(h2 * Math.exp(z * 0.25) / per * (peak && lev.L5 ? 1.6 : 1));
      st.motoPer = per;
    });
    out.total = {
      routes: sum(out.stations.map(s => s.paidRoutes)), R7: sum(out.stations.map(s => s.R7)), temp: sum(out.stations.map(s => s.tempRoutes)),
      blocks: sum(out.flex.map(f => sum(f.blocks))), moto: sum(out.stations.map(s => s.motoShifts)),
      f7: sum(out.cells.map(x => x.f7)), f1: sum(out.cells.map(x => x.f1)), truth: sum(out.cells.map(x => x.truth)),
      surge: mean(out.stations.map(s => s.surge7)),
    };
    if (!peak) S.normalR = out.stations.map(s => s.paidRoutes);
    return out;
  }
  // effective Flex cost per package: blocks are paid whole, so plan at the utilisation we actually reach
  function flexEff(S, ue, surge) { return S.C.flex.block * surge / (ue.pkgBlock * 0.88) + S.C.dsp.varPkg; }
  function winList(ext) { return ext ? [WIN_EXT[0], ...WIN, WIN_EXT[1]] : WIN; }
  // expected window distribution the Assign layer will produce (used to pre-book blocks)
  function windowPrefs(p, W, c) {
    const nhOf = k => { const w = W[k]; const j = WIN.findIndex(x => x.k === w.k); return j >= 0 ? p.nhW[j] : (w.k === 'W0' ? p.nhW[0] * 0.8 : p.nhW[3] * 0.9); };
    const nh = W.map((_, k) => nhOf(k) + (W[k].k === 'W0' || W[k].k === 'W5' ? 0.015 : 0));
    const ord = nh.map((v, k) => [v, k]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const nd = W.map(() => 0); nd[ord[0]] = 0.55; nd[ord[1]] = 0.3; nd[ord[2] ?? ord[0]] += 0.15;
    // same-day: order times spread over the morning; earliest feasible window that is also low risk
    const sdv = W.map(() => 0);
    for (let q = 0; q < 20; q++) {
      const t = 60 + q * 40;
      const feas = W.map((w, k) => (w.s >= t + 60 ? k : -1)).filter(k => k >= 0);
      if (!feas.length) continue;
      feas.sort((a, b) => nh[a] - nh[b]);
      sdv[feas[0]] += 1;
    }
    const tot = sum(sdv) || 1;
    return { nd, sd: sdv.map(x => x / tot), nh };
  }

  /* route builder: sweep the station's cells by bearing and fill vans by time budget */
  function buildRoutes(S, st, demand, maxRoutes) {
    const C = S.C, cells = S.cells;
    const list = demand.filter(d => d.q >= 0.5).map(d => ({ ...d, c: cells[d.i], left: Math.round(d.q) }));
    list.sort((a, b) => Math.atan2(a.c.lat - st.lat, a.c.lng - st.lng) - Math.atan2(b.c.lat - st.lat, b.c.lng - st.lng) || a.c.dSt - b.c.dSt);
    const tm = (a, b) => km(a, b) * 1.3 / C.dsp.speed * 60;
    const routes = [], served = {};
    let k = 0;
    while (k < list.length && routes.length < maxRoutes) {
      const route = { stops: [], load: 0, time: C.dsp.overhead, pos: st };
      while (k < list.length) {
        const it = list[k];
        if (it.left <= 0) { k++; continue; }
        const go = tm(route.pos, it.c), back = tm(it.c, st);
        const avail = C.dsp.shift - route.time - go - back;
        const mpp = S.prof ? S.prof[it.i].ue.mppVan : unitEconomics(it.c, C).mppVan;
        const fit = Math.min(Math.floor(avail / mpp), C.dsp.cap - route.load);
        if (fit < 3) break;
        const n = Math.min(fit, it.left);
        route.stops.push({ i: it.i, n });
        route.load += n; route.time += go + n * mpp; route.pos = it.c;
        served[it.i] = (served[it.i] || 0) + n; it.left -= n;
        if (it.left > 0) break;
        k++;
      }
      if (!route.stops.length) { k++; continue; }
      route.time += tm(route.pos, st);
      route.util = (route.time) / C.dsp.shift;
      routes.push(route);
    }
    return { routes, served };
  }

  /* ---------- ASSIGN layer: package level decisions in real time ---------- */
  function genPackages(S, opt = {}) {
    const mult = opt.mult || 1, lev = opt.levers || {}, eg = opt.egypt || {};
    const pk = [];
    const shifted = { n: 0, credit: 0 };
    S.cells.forEach((c, i) => {
      const v = truthVolume(S, c, D, mult);
      const r = rng(hash(S.cityKey, c.id, 'pk', mult));
      v.byPromise.forEach((x, pr) => {
        let n = Math.round(x);
        const n0 = n;
        if (mult > 1.2 && lev.L3 && pr === 3) n = Math.round(n * 0.65); // standard orders spread to quieter days
        if (mult > 1.2 && lev.L3 && pr === 2) n = Math.round(n * 0.85); // next day buyers offered a later date for a credit
        if (n0 > n) { shifted.n += n0 - n; if (pr === 2) shifted.credit += n0 - n; }
        for (let q = 0; q < n; q++) {
          // order time: next day/standard ordered the day before; same day overnight to 14:00; 2h 08:00 to 20:00
          let t;
          if (pr >= 2) t = -1440 + 360 + r() * 960;
          else if (pr === 1) t = Math.min(840, Math.max(0, 60 + 640 * Math.pow(r(), 0.8) + 60 * gauss(r)));
          else t = 480 + r() * 720;
          const u = r();
          const sz = u < c.T.small ? 0 : (u < 1 - c.T.large ? 1 : 2);
          const k = Math.floor(r() * 6), a = r(), b = r();
          const aa = Math.min(a, b), bb = Math.max(a, b);
          const v1 = c.b[k], v2 = c.b[(k + 1) % 6];
          const lat = c.lat * (1 - bb) + v1[0] * aa + v2[0] * (bb - aa);
          const lng = c.lng * (1 - bb) + v1[1] * aa + v2[1] * (bb - aa);
          pk.push({ id: pk.length, i, pr, sz, cod: r() < c.T.cod, t, lat, lng, u1: r(), u2: r(), u3: r(), conf: r() < 0.7 });
        }
      });
    });
    pk.sort((a, b) => a.t - b.t);
    pk.forEach((p, j) => p.seq = j);
    pk.shifted = shifted;
    return pk;
  }

  function simulate(S, policy, prep, pk, opt = {}) {
    const { cells, prof, C } = S;
    const mult = opt.mult || 1, lev = opt.levers || {}, eg = opt.egypt || {};
    const peak = mult > 1.2;
    const fw = policy === 'fw';
    const isEG = S.cityKey === 'cairo';
    const egOn = isEG && fw && eg.on;
    const W = winList(fw && peak && lev.L4);
    const dayEnd = W[W.length - 1].e;
    const log = [];
    const res = pk.map(() => ({}));

    /* ---- capacity for this policy ---- */
    let stations, flexCap, motoCap;
    if (fw) {
      stations = prep.stations.map(st => ({ ...st, served: { ...st.served } }));
      flexCap = prep.flex.map(f => ({ id: f.id, station: f.station, pkgBlock: f.pkgBlock, cap: f.blocks.map(b => b * f.pkgBlock), sched: [...f.blocks], inst: f.blocks.map(() => 0), used: f.blocks.map(() => 0) }));
      motoCap = prep.stations.map(st => ({ cap: st.motoShifts * st.motoPer, shifts: st.motoShifts, used: 0 }));
    } else {
      // current state: each channel plans on its own. DSP: 73% of average volume; Flex: 27% spread evenly
      stations = S.stations.map(s => {
        const own = cells.filter(c => c.station === s.i);
        const avg = sum(own.map(c => prof[c.i].mean * S.wd[dow(D)])) * (peak ? Math.min(mult, 1.25) : 1);
        // the DSP team sizes its own fleet for 73% of average volume, spread over every zone in proportion to volume
        const eligAvg = sum(own.map(c => prof[c.i].mean * S.wd[dow(D)] * prof[c.i].elig));
        const ratio = Math.min(1, avg * 0.73 / Math.max(1, eligAvg));
        const plan73 = own.map(c => ({ i: c.i, q: prof[c.i].mean * S.wd[dow(D)] * prof[c.i].elig * ratio }));
        const R = buildRoutes(S, s, plan73, Infinity).routes.length;
        const elig = own.map(c => ({ i: c.i, q: Math.min(sum(pk.filter(p => p.i === c.i && p.pr >= 2).map(() => 1)), prof[c.i].mean * S.wd[dow(D)] * prof[c.i].elig * ratio * 1.1) }));
        const rb = buildRoutes(S, s, elig, R);
        return { i: s.i, R7: R, Rmin: R, routes: rb.routes, served: rb.served, paidRoutes: Math.max(R, rb.routes.length), R1: rb.routes.length, tempRoutes: 0 };
      });
      flexCap = S.clusters.map(cl => {
        const vol = sum(cl.cells.map(i => prof[i].mean * S.wd[dow(D)]));
        const pkgBlock = mean(cl.cells.map(i => prof[i].ue.pkgBlock));
        const blocks = Math.ceil(vol * 0.27 * (peak ? Math.min(mult, 1.25) : 1) / pkgBlock);
        const per = W.map((_, k) => Math.floor(blocks / W.length) + (k < blocks % W.length ? 1 : 0));
        return { id: cl.id, station: cl.station, pkgBlock, cap: per.map(b => b * pkgBlock), sched: per, inst: per.map(() => 0), used: per.map(() => 0) };
      });
      motoCap = S.stations.map(s => {
        const own = cells.filter(c => c.station === s.i);
        const h2 = sum(own.map(c => prof[c.i].mean * S.wd[dow(D)] * prof[c.i].share[0] * c.T.small));
        const per = mean(own.map(c => prof[c.i].ue.pkgMoto));
        const sh = Math.ceil(h2 / per);
        return { cap: sh * per, shifts: sh, used: 0 };
      });
    }
    const pool = S.stations.map(s => C.flex.poolPerStation * (peak && fw && lev.L2 ? 2.0 : 1));
    const schedBlocks = S.stations.map(s => sum(flexCap.filter(f => f.station === s.i).map(f => sum(f.sched))));
    const surge7 = S.stations.map((s, k) => surgeOf(C, schedBlocks[k] / pool[k]) * (peak && fw && lev.L2 ? 1.1 : 1));
    // scheduled blocks beyond the driver pool do not all get claimed
    flexCap.forEach(f => {
      const util = schedBlocks[f.station] / pool[f.station];
      const fill = util <= 1 ? 1 : clamp(1 / util + 0.15, 0.4, 1);
      f.fill = fill;
      f.cap = f.cap.map(x => x * fill);
    });

    /* ---- helpers ---- */
    const nhAt = (i, wk) => {
      const p = prof[i];
      if (wk === 'dsp') return (p.nhW[0] + p.nhW[1] + p.nhW[2]) / 3;
      const j = WIN.findIndex(x => x.k === W[wk].k);
      let v = j >= 0 ? p.nhW[j] : (W[wk].k === 'W0' ? p.nhW[0] * 0.8 : p.nhW[3] * 0.9);
      return v;
    };
    const failProb = (pkg, wk, mode) => {
      const c = cells[pkg.i];
      let nh = nhAt(pkg.i, wk);
      let addr = c.T.addrFail;
      let cod = pkg.cod ? C.codRefusal : 0;
      if (egOn) {
        if (eg.E1) nh *= pkg.conf ? 0.4 : 1.05;
        if (eg.E2) addr *= 0.45;
        if (eg.E3) cod *= 0.55;
      }
      if (mode === 'pickup') return 0.01;
      return clamp(nh + addr + cod, 0, 0.9);
    };
    const failCost = (pkg) => (prof[pkg.i].ue.cppFlex + C.reattemptExtra) + C.latePenalty * 0.5;

    const feasWin = (pkg, now) => {
      const out = [];
      if (pkg.pr === 0) { W.forEach((w, k) => { if (w.e > now + 30 && w.s < now + 120) out.push(k); }); }
      else if (pkg.pr === 1) { W.forEach((w, k) => { if (w.s >= now + 60 || (w.e - now >= 120 && now >= w.s)) out.push(k); }); }
      else W.forEach((_, k) => out.push(k));
      return out;
    };
    const tryInstant = (pkg, fc, wk, now) => {
      const st = fc.station;
      const util = (schedBlocks[st] + instUsed[st]) / pool[st];
      const r = rng(hash(S.cityKey, pkg.id, 'inst', policy))();
      const pFill = clamp(1.15 - 0.55 * util, 0.25, 0.97);
      if (r > pFill) return null;
      const timeLeft = Math.min(W[wk].e, dayEnd) - Math.max(now + 30, W[wk].s);
      if (timeLeft < 60) return null;
      const capAdd = fc.pkgBlock * Math.min(1, timeLeft / (C.flex.hours * 60));
      const price = C.flex.block * (1 + C.flex.instantPremium) * surgeOf(C, util);
      return { capAdd, price };
    };

    /* ---- batch: next day / standard packages at D-1 night (DSP routes are built from them) ---- */
    const dspLeft = {};
    stations.forEach(st => { for (const [i, n] of Object.entries(st.served)) dspLeft[i] = n; });
    let costInst = 0, credits = 0, pickupCost = 0;
    const pickupRate = (i) => (egOn && eg.E4 && ['informal', 'oldtown'].includes(cells[i].type)) ? 0.14 : 0;

    const snaps = [];
    let nextSnap = 6;
    const snap = (h) => snaps.push({ h, dspLeft: { ...dspLeft }, used: flexCap.map(f => [...f.used]), cap: flexCap.map(f => [...f.cap]), moto: motoCap.map(m => m.used), inst: [...instUsed] });
    for (const pkg of pk) {
      while (pkg.t >= nextSnap * 60 && nextSnap <= 23) { snap(nextSnap); nextSnap++; }
      const R = res[pkg.id];
      const c = cells[pkg.i], p = prof[pkg.i];
      const fc = flexCap[c.cluster], mc = motoCap[c.station];
      const tr = [];
      const now = Math.max(0, pkg.t);
      // step 0: Egypt pickup option for high-risk zones
      if (pickupRate(pkg.i) && pkg.u3 < pickupRate(pkg.i) && pkg.pr >= 1) {
        R.ch = 3; R.mode = 'pickup'; R.w = 1; pickupCost += p.ue.cppFlex * 0.4;
        tr.push(['위험 필터', `실패 위험 지역 · 픽업 포인트 수령 선택(고객 동의)`]);
        R.tr = tr; continue;
      }
      // step 1: promise filter
      const feas = feasWin(pkg, now);
      const allowed = [];
      if (pkg.pr >= 2) allowed.push('DSP', 'Flex');
      else if (pkg.pr === 1) { allowed.push('Flex'); if (pkg.t < 300) allowed.unshift('DSP'); if (pkg.sz === 0) allowed.push('오토바이'); }
      else { if (pkg.sz === 0) allowed.push('오토바이'); allowed.push('Flex'); }
      tr.push(['약속', `${PROMISE[pkg.pr]} 배송 → 가능 채널: ${allowed.join(', ')}`]);
      // step 2: size filter
      if (pkg.sz === 2) { const k = allowed.indexOf('오토바이'); if (k >= 0) allowed.splice(k, 1); tr.push(['크기', '대형 → 오토바이 제외, 차량만']); }
      else tr.push(['크기', pkg.sz === 0 ? '소형 → 오토바이까지 모든 차량 가능' : '중형 → 차량(DSP 밴, Flex 승용차)만, 오토바이는 소형 전용']);
      // step 3: success risk (time window ranking)
      const extPen = k => (W[k].k === 'W0' || W[k].k === 'W5') ? 0.015 : 0;
      const order = fw ? [...feas].sort((a, b) => failProb(pkg, a) + extPen(a) - failProb(pkg, b) - extPen(b)) : [...feas].sort((a, b) => a - b);
      if (fw) {
        const best = order[0];
        tr.push(['성공 가능성', `부재 위험이 가장 낮은 시간대: ${W[best] ? W[best].ko : '-'} (${(nhAt(pkg.i, best ?? 0) * 100).toFixed(1)}%)` + (egOn && eg.E1 ? (pkg.conf ? ' · WhatsApp 확인됨' : ' · 확인 미응답') : '')]);
      } else tr.push(['성공 가능성', '현재 방식: 가장 이른 시간대부터 채움(부재 위험 미반영)']);

      // step 4: choose the cheapest feasible option (marginal cost + expected failure cost)
      const opts = [];
      if (allowed.includes('DSP') && (dspLeft[pkg.i] || 0) > 0) {
        opts.push({ ch: 0, w: 'dsp', mc: C.dsp.varPkg, label: 'DSP 경로 빈자리' });
      }
      if (allowed.includes('Flex')) {
        for (const wk of order) {
          // Flex seats are scarce later in the day: next day packages carry an opportunity cost so they do not crowd out same day orders
          const shadow = pkg.pr >= 2 ? 0.5 * p.ue.cppFlex : 0;
          if (fc.cap[wk] - fc.used[wk] >= 1) { opts.push({ ch: 1, w: wk, mc: C.dsp.varPkg + shadow, label: `Flex ${W[wk].ko} 블록 빈자리` }); if (!fw) break; }
        }
      }
      if (allowed.includes('오토바이') && mc.cap - mc.used >= 1) opts.push({ ch: 2, w: order[0] ?? 0, mc: p.ue.cppMoto * (pkg.pr === 0 ? 0.6 : 1), label: '오토바이 여유' });
      opts.forEach(o => { o.exp = o.mc + (fw ? failProb(pkg, o.w) * failCost(pkg) : 0); });
      let pick = null;
      if (opts.length) {
        if (fw) { opts.sort((a, b) => a.exp - b.exp); pick = opts[0]; }
        else { pick = opts.find(o => o.ch === 0) || opts.find(o => o.ch === (pkg.pr === 0 ? 2 : 1)) || opts[0]; }
        tr.push(['비용 비교', opts.slice(0, 3).map(o => `${o.label} ${o.exp.toFixed(1)}`).join(' · ')]);
      }
      // step 5: no spare capacity -> levers
      if (!pick && feas.length) {
        let inst = null, wk = null;
        if (allowed.includes('Flex')) for (const k of order) { inst = tryInstant(pkg, fc, k, now); if (inst) { wk = k; break; } }
        const instCostPkg = inst ? inst.price / Math.max(1, inst.capAdd * 0.8) : Infinity;
        const shapeOK = fw && (pkg.pr <= 1);
        const shapeCost = 0.6 * C.shapeCredit + 0.4 * (C.latePenalty + p.ue.cppFlex + C.reattemptExtra);
        if (inst && (!shapeOK || instCostPkg <= shapeCost)) {
          fc.cap[wk] += inst.capAdd; fc.inst[wk] += 1; instUsed[c.station] += 1; costInst += inst.price;
          pick = { ch: 1, w: wk, label: '즉시 블록 추가', mc: instCostPkg };
          tr.push(['레버', `빈자리 없음 → Flex 즉시 블록 추가 (${Math.round(inst.price)} ${S.C0.cur}, 서지 반영)`]);
        } else if (shapeOK) {
          const accept = pkg.u2 < 0.6;
          if (accept) {
            R.ch = 3; R.mode = 'shaped'; credits += C.shapeCredit;
            tr.push(['레버', pkg.pr === 0 ? '2시간 슬롯 미노출 → 오늘 저녁 무료 배송 선택' : '다음 날 오전 + 크레딧 제안 → 고객 수락']);
            R.tr = tr; R.ok = true; R.onTime = true; R.w = W.length - 1; continue;
          }
          tr.push(['레버', '조정 제안 거절']);
        }
      }
      if (!pick && feas.length === 0 && pkg.pr <= 1) tr.push(['약속', '남은 시간대가 없음']);
      if (!pick) {
        R.why = feas.length ? 'cap' : 'nowin';
        // late: deliver tomorrow morning by Flex
        R.ch = 4; R.late = true; R.w = 0; R.ok = pkg.u1 > failProb(pkg, 0); R.onTime = false;
        tr.push(['결과', '용량 부족 → 약속 지연']);
        R.tr = tr; continue;
      }
      // commit
      R.ch = pick.ch; R.w = pick.w; R.mc = pick.mc;
      if (pick.ch === 0) { dspLeft[pkg.i] -= 1; }
      else if (pick.ch === 1) fc.used[pick.w] += 1;
      else if (pick.ch === 2) mc.used += 1;
      const pf = failProb(pkg, pick.w);
      R.pf = pf; R.ok = pkg.u1 > pf; R.onTime = R.ok;
      tr.push(['선택', `${CH[pick.ch]} · ${W[pick.w] ? W[pick.w].ko : ''} · 실패 확률 ${(pf * 100).toFixed(1)}% → ${R.ok ? '첫 시도 성공' : '부재/주소 문제로 실패, 재배송'}`]);
      R.tr = tr;
      if (log.length < 400 && (pkg.pr <= 1) && (pkg.id % 37 === 0 || tr.some(x => x[0] === '레버'))) log.push(pkg.id);
    }

    while (nextSnap <= 23) { snap(nextSnap); nextSnap++; }
    /* ---- cost accounting ---- */
    let costDSP = 0;
    stations.forEach(st => {
      const temp = st.tempRoutes || 0;
      costDSP += (st.paidRoutes - temp) * C.dsp.route + temp * C.dsp.route * 1.1;
    });
    let costFlex = 0;
    flexCap.forEach(f => { costFlex += sum(f.sched) * f.fill * C.flex.block * surge7[f.station]; });
    costFlex += costInst;
    let costMoto = sum(motoCap.map(m => m.shifts)) * C.moto.shift;
    const n = pk.length;
    let ok = 0, onTime = 0, late = 0, fail = 0, shaped = 0, pickup = 0;
    const byCh = [0, 0, 0, 0, 0];
    res.forEach((r, j) => {
      byCh[r.ch]++;
      if (r.mode === 'pickup') { pickup++; ok++; onTime++; return; }
      if (r.mode === 'shaped') { shaped++; ok++; onTime++; return; }
      if (r.late) late++;
      if (r.ok) ok++; else fail++;
      if (r.onTime) onTime++;
    });
    const varCost = n * C.dsp.varPkg;
    const reatt = fail * (mean(prof.map(p => p.ue.cppFlex)) + C.reattemptExtra) + late * mean(prof.map(p => p.ue.cppFlex));
    // packages moved to quieter days by demand shaping still cost money: delivered later at the normal day rate, plus credits
    const sh = pk.shifted || { n: 0, credit: 0 };
    const shiftedCost = sh.n * (S.normalCpp || 0) + sh.credit * C.shapeCredit;
    const total = costDSP + costFlex + costMoto + varCost + reatt + credits + pickupCost + shiftedCost;
    const routeTimeUsed = sum(stations.map(st => sum(st.routes.map(r => r.time))));
    const routeTimePaid = sum(stations.map(st => st.paidRoutes)) * C.dsp.shift;
    const flexUsed = sum(flexCap.map(f => sum(f.used))), flexCapT = sum(flexCap.map(f => sum(f.cap)));
    const nAll = n + sh.n;
    const kpi = {
      n, nAll, shiftedN: sh.n, shiftedCost, total, cpp: total / nAll, cpsd: total / Math.max(1, ok + sh.n),
      fas: ok / n, onTime: (onTime + sh.n) / nAll, late, fail, shaped, pickup,
      share: byCh.map(x => x / n), byCh,
      costDSP, costFlex, costMoto, costInst, credits, reatt, varCost, pickupCost,
      routes: sum(stations.map(st => st.paidRoutes)), idleRoutes: sum(stations.map(st => Math.max(0, st.paidRoutes - st.routes.length))),
      dspUtil: routeTimeUsed / Math.max(1, routeTimePaid),
      blocks: sum(flexCap.map(f => sum(f.sched) * f.fill)) + sum(flexCap.map(f => sum(f.inst))), instBlocks: sum(flexCap.map(f => sum(f.inst))),
      flexUtil: flexUsed / Math.max(1, flexCapT), motoShifts: sum(motoCap.map(m => m.shifts)),
      surge: mean(surge7), usd: total / S.C0.perUSD,
    };
    return { policy, res, kpi, stations, flexCap, motoCap, log, W, snaps, fw, egOn, eg, pool, schedBlocks };
  }

  /* what-if: run the decision flow for one hypothetical package against the capacity left at that hour */
  function decideOne(S, sim, spec) {
    const { cells, prof, C } = S;
    const c = cells[spec.i], p = prof[spec.i], W = sim.W;
    const h = clamp(Math.floor(Math.max(spec.t, 360) / 60), 6, 23);
    const sn = sim.snaps.find(x => x.h === h) || sim.snaps[sim.snaps.length - 1];
    const fcI = c.cluster, fc = sim.flexCap[fcI];
    const steps = [];
    const now = Math.max(0, spec.t);
    const feas = [];
    if (spec.pr === 0) W.forEach((w, k) => { if (w.e > now + 30 && w.s < now + 120) feas.push(k); });
    else if (spec.pr === 1) W.forEach((w, k) => { if (w.s >= now + 60 || (w.e - now >= 120 && now >= w.s)) feas.push(k); });
    else W.forEach((_, k) => feas.push(k));
    const allowed = [];
    if (spec.pr >= 2) allowed.push('DSP', 'Flex');
    else if (spec.pr === 1) { allowed.push('Flex'); if (spec.t < 300) allowed.unshift('DSP'); if (spec.sz === 0) allowed.push('오토바이'); }
    else { if (spec.sz === 0) allowed.push('오토바이'); allowed.push('Flex'); }
    steps.push({ k: '1 약속', ok: true, t: `${PROMISE[spec.pr]} 배송 · 주문 ${String(Math.floor(now / 60)).padStart(2, '0')}:${String(Math.round(now % 60)).padStart(2, '0')} → 가능 채널 ${allowed.join(', ')} · 가능한 시간대 ${feas.map(k => W[k].ko).join(', ') || '없음'}` });
    if (spec.sz === 2 && allowed.includes('오토바이')) allowed.splice(allowed.indexOf('오토바이'), 1);
    steps.push({ k: '2 크기', ok: true, t: ['소형: 오토바이까지 모든 차량 가능', '중형: 차량만 (오토바이는 소형 전용)', '대형: 차량만'][spec.sz] });
    const nhOf = k => { if (k === 'dsp') return (p.nhW[0] + p.nhW[1] + p.nhW[2]) / 3; const j = WIN.findIndex(x => x.k === W[k].k); return j >= 0 ? p.nhW[j] : p.nhW[3]; };
    let pfOf = k => nhOf(k) + c.T.addrFail + (spec.cod ? C.codRefusal : 0);
    if (sim.egOn) { const e = sim.eg; const f0 = pfOf; pfOf = k => nhOf(k) * (e.E1 ? 0.45 : 1) + c.T.addrFail * (e.E2 ? 0.45 : 1) + (spec.cod ? C.codRefusal * (e.E3 ? 0.55 : 1) : 0); }
    const order = sim.fw ? [...feas].sort((a, b) => pfOf(a) - pfOf(b)) : [...feas];
    steps.push({ k: '3 성공 가능성', ok: true, t: feas.length ? feas.map(k => `${W[k].ko} ${(pfOf(k) * 100).toFixed(1)}%`).join(' · ') + (sim.fw ? ` → ${W[order[0]].ko} 우선` : ' → 현재 방식은 이른 시간대부터') : '남은 시간대 없음' });
    const failCost = p.ue.cppFlex + C.reattemptExtra + C.latePenalty * 0.5;
    const opts = [];
    if (allowed.includes('DSP') && (sn.dspLeft[spec.i] || 0) > 0) opts.push({ ch: 0, w: 'dsp', label: `DSP 빈자리 (${sn.dspLeft[spec.i]}석)`, mc: C.dsp.varPkg });
    if (allowed.includes('Flex')) for (const k of order) { const left = Math.floor(sn.cap[fcI][k] - sn.used[fcI][k]); if (left >= 1) opts.push({ ch: 1, w: k, label: `Flex ${W[k].ko} (${left}석)`, mc: C.dsp.varPkg + (spec.pr >= 2 ? 0.5 * p.ue.cppFlex : 0) }); }
    const mcap = sim.motoCap[c.station];
    if (allowed.includes('오토바이') && mcap.cap - sn.moto[c.station] >= 1) opts.push({ ch: 2, w: order[0] ?? 0, label: '오토바이', mc: p.ue.cppMoto * (spec.pr === 0 ? 0.6 : 1) });
    opts.forEach(o => { o.pf = pfOf(o.w); o.exp = o.mc + (sim.fw ? o.pf * failCost : 0); });
    opts.sort((a, b) => a.exp - b.exp);
    steps.push({ k: '4 비용 비교', ok: opts.length > 0, t: opts.length ? opts.slice(0, 4).map(o => `${o.label}: 한계비용 ${o.mc.toFixed(1)} + 실패비용 ${(o.pf * failCost).toFixed(1)} = ${o.exp.toFixed(1)} ${S.C0.cur}`).join('\n') : '남은 자리가 없음' });
    let pick = opts[0] || null;
    if (!pick) {
      const util = (sim.schedBlocks[c.station] + sn.inst[c.station]) / sim.pool[c.station];
      const price = C.flex.block * (1 + C.flex.instantPremium) * surgeOf(C, util);
      const shapeCost = 0.6 * C.shapeCredit + 0.4 * (C.latePenalty + p.ue.cppFlex + C.reattemptExtra);
      const instPkg = price / Math.max(1, fc.pkgBlock * 0.8);
      steps.push({ k: '5 레버', ok: true, t: `즉시 블록 ${Math.round(price)} ${S.C0.cur} (패키지당 약 ${instPkg.toFixed(1)}) vs 고객에게 다른 시간대 제안 (기대비용 ${shapeCost.toFixed(1)}) → ${sim.fw && spec.pr <= 1 && shapeCost < instPkg ? '시간대 조정 제안' : '즉시 블록 추가'}` });
      return { steps, result: sim.fw && spec.pr <= 1 && shapeCost < instPkg ? '고객에게 다른 시간대 제안' : 'Flex 즉시 블록 추가', pf: null };
    }
    return { steps, result: `${CH[pick.ch]}${pick.w !== 'dsp' && W[pick.w] ? ' · ' + W[pick.w].ko : ''}`, pf: pick.pf, pick };
  }

  /* ---------- LEARN layer: compare forecasts with actuals and update the profile ---------- */
  function learn(S, prep, sim, pk) {
    const { cells, prof } = S;
    const act = cells.map(() => ({ n: 0, fail: 0, nh: [0, 0, 0, 0], nhN: [0, 0, 0, 0] }));
    pk.forEach(p => {
      const r = sim.res[p.id]; const a = act[p.i];
      a.n++;
      if (r.mode) return;
      const wk = sim.W[r.w] ? WIN.findIndex(x => x.k === sim.W[r.w].k) : -1;
      if (wk >= 0) { a.nhN[wk]++; if (!r.ok) a.nh[wk]++; }
      if (!r.ok) a.fail++;
    });
    const rows = cells.map((c, i) => {
      const x = prep.cells[i], a = act[i], p = prof[i];
      const e7 = (x.f7 - x.truth) / x.truth, e1 = (x.f1 - x.truth) / x.truth;
      const alpha = 0.15;
      const nhNew = p.nhW.map((v, k) => a.nhN[k] >= 20 ? (1 - alpha) * v + alpha * (a.nh[k] / a.nhN[k]) : v);
      const fasToday = a.n ? 1 - a.fail / a.n : p.fas;
      return { i, e7, e1, truth: x.truth, f7: x.f7, f1: x.f1, fasToday, fasNew: (1 - alpha) * p.fas + alpha * fasToday, nhNew, addrNew: p.addr * (S.cityKey === 'cairo' ? 0.97 : 0.995) };
    });
    const mape = k => mean(rows.map(r => Math.abs(r[k])));
    const tot = (k) => sum(rows.map(r => r[k]));
    return { rows, mape7: mape('e7'), mape1: mape('e1'), net7: tot('f7') / tot('truth') - 1, net1: tot('f1') / tot('truth') - 1 };
  }

  return { build, plan, prepare, genPackages, simulate, learn, decideOne, buildRoutes, unitEconomics, forecast, COUNTRY, WIN, WIN_EXT, PROMISE, CH, D, TODAY, HIST, fmtDate, dow, dateOf, mean, sum, quantile, clamp, km, surgeOf, EVENTS, normInv };
})();

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const E = ENG;
  const WIN = E.WIN;
  /* ---------- formatting ---------- */
  const F = {
    n: (x, d = 0) => (x == null || !isFinite(x)) ? '·' : Number(x).toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d }),
    p: (x, d = 1) => (x == null || !isFinite(x)) ? '·' : (x * 100).toFixed(d) + '%',
    pp: (x, d = 1) => (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + 'p',
    k: x => { const a = Math.abs(x); return a >= 1e6 ? (x / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (x / 1e3).toFixed(0) + 'k' : a >= 1e3 ? (x / 1e3).toFixed(1) + 'k' : x.toFixed(0); },
    t: m => { m = Math.max(0, Math.round(m)); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); },
    sgn: (x, d = 1) => (x > 0 ? '+' : '') + x.toFixed(d),
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
  const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); t = Math.max(0, Math.min(1, t)); return 'rgb(' + A.map((x, i) => Math.round(x + (B[i] - x) * t)).join(',') + ')'; };
  const CHK = ['dsp', 'flex', 'moto', 'shape', 'late'];
  const CHN = ['DSP', 'Flex', '오토바이', '픽업/조정', '지연'];
  const ARCH_COL = { A: '--archA', B: '--archB', C: '--archC', D: '--archD' };

  /* ---------- state ---------- */
  const APP = {
    city: 'dubai', tab: 'overview', scen: 'normal', z: 0.3, sel: null, lens: 'arch', station: 0,
    clock: 600, playing: false, speed: 120, dotPolicy: 'fw', pick: null,
    peak: { mult: 2.0, lev: { L1: 1, L2: 1, L3: 1, L4: 0, L5: 0 }, res: null },
    eg: { on: true, E1: 1, E2: 1, E3: 1, E4: 1 }, egRes: null, other: null, trade: null, overrides: {},
    chat: [], aiBusy: false,
  };
  const SCEN = { normal: { mult: 1, ko: '평일' }, q4: { mult: 2.0, ko: 'Q4 피크 2.0×' }, wf: { mult: 2.6, ko: 'White Friday 2.6×' } };
  let ST = null; // computed bundle for the current city and scenario

  function busy(msg, fn) {
    const L = $('#loading'); $('#loadingText').textContent = msg; L.hidden = false;
    return new Promise(res => setTimeout(() => {
      try { fn(); L.hidden = true; }
      catch (e) { console.error(e); $('#loadingText').textContent = '계산하지 못했습니다: ' + (e && e.message ? e.message : e) + ' · 입력값을 확인해 주세요.'; setTimeout(() => { L.hidden = true; }, 3500); }
      res();
    }, 30));
  }

  function compute() {
    const S = E.build(GEO, APP.city, APP.overrides);
    E.plan(S, { z: APP.z });
    const egypt = APP.city === 'cairo' ? APP.eg : {};
    const p0 = E.prepare(S, { z: APP.z });
    const pk0 = E.genPackages(S, {});
    const fw0 = E.simulate(S, 'fw', p0, pk0, { egypt });
    S.normalCpp = fw0.kpi.cpp;
    let prep = p0, pk = pk0, fw = fw0, base, pkB = pk0;
    const sc = SCEN[APP.scen];
    if (sc.mult > 1) {
      const opt = { mult: sc.mult, levers: APP.peak.lev, z: APP.z, egypt };
      prep = E.prepare(S, opt); pk = E.genPackages(S, opt); fw = E.simulate(S, 'fw', prep, pk, opt);
      pkB = E.genPackages(S, { mult: sc.mult });
      base = E.simulate(S, 'base', E.prepare(S, { mult: sc.mult, z: APP.z }), pkB, { mult: sc.mult });
    } else base = E.simulate(S, 'base', p0, pk0, {});
    const learn = E.learn(S, prep, fw, pk);
    ST = { S, prep, pk, pkB, fw, base, learn, p0, fw0, byId: {} };
    if (APP.sel == null || APP.sel >= S.cells.length) {
      const nm = APP.city === 'dubai' ? 'Dubai Marina' : 'Nasr City';
      const a = S.G.anchors.find(x => x.name === nm);
      let b = 0, bd = 1e9; S.cells.forEach((c, i) => { const d = E.km(c, a); if (d < bd) { bd = d; b = i; } });
      APP.sel = b;
    }
    APP.trade = null; APP.peak.res = null; APP.egRes = null;
  }

  /* ============================================================
     MAP
     ============================================================ */
  let map, baseLayers = [], cellLayer = [], labelLayer = [], stationLayer = [], routeLayer = null, dotLayer = null;
  function initMap() {
    map = L.map('map', { zoomControl: true, attributionControl: false, zoomSnap: 0.25, minZoom: 8.5, maxZoom: 15, zoomAnimation: true });
    map.zoomControl.setPosition('topright');
    const dp = map.createPane('dots'); dp.style.zIndex = 450; dp.style.pointerEvents = 'none';
    map.on('zoomend', () => {
      const z = map.getZoom();
      labelLayer.forEach(m => { const el = m.getElement(); if (el) el.firstChild.classList.toggle('hide', z < (APP.fitZoom ?? 10.5) - 0.3); });
    });
    map.on('click', e => { if (APP.tab === 'assign') pickDotAt(e.containerPoint); });
    const DL = L.Layer.extend({
      onAdd(m) { this._m = m; this._c = L.DomUtil.create('canvas', 'dot-canvas leaflet-zoom-hide'); m.getPane('dots').appendChild(this._c); m.on('moveend zoomend resize viewreset', this._reset, this); this._reset(); },
      onRemove(m) { L.DomUtil.remove(this._c); m.off('moveend zoomend resize viewreset', this._reset, this); },
      _reset() { const m = this._m, s = m.getSize(), dpr = window.devicePixelRatio || 1; L.DomUtil.setPosition(this._c, m.containerPointToLayerPoint([0, 0])); this._c.width = s.x * dpr; this._c.height = s.y * dpr; this._c.style.width = s.x + 'px'; this._c.style.height = s.y + 'px'; this.draw(); },
      draw() {
        const m = this._m, ctx = this._c.getContext('2d'), dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, this._c.width, this._c.height);
        if (!this.pts) return;
        const cols = CHK.map(k => cssv('--' + k)); const z = m.getZoom(); const r = z >= 13 ? 3.4 : z >= 11.5 ? 2.6 : 2.0;
        this.screen = [];
        for (const d of this.pts) {
          if (d.at > APP.clock) continue;
          const p = m.latLngToContainerPoint([d.lat, d.lng]);
          ctx.fillStyle = cols[d.ch]; ctx.globalAlpha = d.done ? 0.95 : 0.7;
          ctx.beginPath(); ctx.arc(p.x, p.y, d.ok === false ? r + 1.2 : r, 0, 6.283); ctx.fill();
          if (d.ok === false) { ctx.globalAlpha = 1; ctx.strokeStyle = cssv('--late'); ctx.lineWidth = 1; ctx.stroke(); }
          this.screen.push([p.x, p.y, d.id]);
        }
        ctx.globalAlpha = 1;
        if (APP.pick != null) { const d = this.pts.find(x => x.id === APP.pick); if (d) { const p = m.latLngToContainerPoint([d.lat, d.lng]); ctx.strokeStyle = cssv('--ink'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 6.283); ctx.stroke(); } }
      },
    });
    dotLayer = new DL();
  }
  function drawBaseMap() {
    const S = ST.S, G = S.G;
    [...baseLayers, ...cellLayer, ...labelLayer, ...stationLayer].forEach(l => map.removeLayer(l));
    baseLayers = []; cellLayer = []; labelLayer = []; stationLayer = [];
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    map.getContainer().style.background = APP.city === 'dubai' ? cssv('--sea') : cssv('--land2');
    G.neighbours.forEach(r => baseLayers.push(L.polygon(r, { stroke: false, fillColor: cssv('--land2'), fillOpacity: 1, interactive: false }).addTo(map)));
    G.land.forEach(r => baseLayers.push(L.polygon(r, { color: cssv('--road'), weight: 0.6, fillColor: cssv('--land'), fillOpacity: 1, interactive: false }).addTo(map)));
    G.water.forEach(w => baseLayers.push(L.polyline(w.pts, { color: cssv('--sea'), weight: w.name === 'Nile' ? 9 : 5, opacity: 1, interactive: false }).addTo(map)));
    G.roads.forEach(rd => {
      const pl = L.polyline(rd.pts, { color: cssv('--road'), weight: 2.2, opacity: 0.9, interactive: true }).addTo(map);
      pl.bindTooltip(rd.name, { sticky: true, className: 'tip' }); baseLayers.push(pl);
    });
    S.cells.forEach((c, i) => {
      const pg = L.polygon(c.b, { weight: 0.6, color: cssv('--cellline'), opacity: 0.55, fillOpacity: 0.62 }).addTo(map);

    const div = (vals, neg, pos, m, fmt) => ({ colors: vals.map(v => v < 0 ? mix(base0, cssv(neg), Math.min(1, -v / m)) : mix(base0, cssv(pos), Math.min(1, v / m))), legend: { ramp: [cssv(neg), base0, cssv(pos)], lo: fmt(-m), hi: fmt(m) } });

  function updateDots() {
    if (APP.tab !== 'assign') { if (map.hasLayer(dotLayer)) map.removeLayer(dotLayer); return; }
    const sim = APP.dotPolicy === 'fw' ? ST.fw : ST.base;
    const pk = APP.dotPolicy === 'fw' ? ST.pk : ST.pkB;
    const step = Math.max(1, Math.ceil(pk.length / 9000));
    const pts = [];
    for (const p of pk) {
      if (p.id % step) continue;
      const r = sim.res[p.id];

      const w = sim.W[r.w];

      pts.push({ id: p.id, lat: p.lat, lng: p.lng, ch: r.ch, at, done: APP.clock >= doneAt, ok: APP.clock >= doneAt ? r.ok : null });

  /* ============================================================

  function lineChart({ series, band, w = 560, h = 190, xMin, xMax, yMin = 0, yMax, xTicks = [], yFmt = v => F.n(v), marks = [] }) {
    const pad = { l: 40, r: 8, t: 8, b: 20 };
    const all = series.flatMap(s => s.pts.map(p => p.y)).concat(band ? band.flatMap(b => [b.lo, b.hi]) : []).concat(marks.map(m => m.y));
    const ym = yMax ?? Math.max(...all) * 1.08;
    const X = x => pad.l + (x - xMin) / (xMax - xMin) * (w - pad.l - pad.r), Y = y => h - pad.b - (y - yMin) / (ym - yMin) * (h - pad.t - pad.b);
    let s = `<svg class="ch" viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
    for (let k = 0; k <= 3; k++) { const v = yMin + (ym - yMin) * k / 3; s += `<line class="ax" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pad.l - 4}" y="${Y(v) + 3}" text-anchor="end">${yFmt(v)}</text>`; }
    xTicks.forEach(t => { s += `<text x="${X(t.x)}" y="${h - 5}" text-anchor="middle">${esc(t.l)}</text>`; });
    if (band) band.forEach(b => { s += `<rect x="${X(b.x) - 5}" y="${Y(b.hi)}" width="10" height="${Math.max(1, Y(b.lo) - Y(b.hi))}" fill="${b.color}" opacity="0.25" rx="2"/>`; });
    series.forEach(se => {
      const d = se.pts.map((p, k) => (k ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
      s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.wd || 1.6}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`;
      (se.dots || []).forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${p.color || se.color}"/>`; });
    });
    marks.forEach(m => { s += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="${m.r || 4}" fill="${m.color}" stroke="${cssv('--panel')}" stroke-width="1.5"/>${m.label ? `<text x="${X(m.x) + (m.dx ?? 7)}" y="${Y(m.y) + (m.dy ?? 3)}" text-anchor="${m.anchor || 'start'}" style="fill:${m.color}">${esc(m.label)}</text>` : ''}`; });
    return s + '</svg>';
  }
  function mixBar(parts) { return `<div class="bar">${parts.map(([v, c, t]) => `<span style="width:${(Math.max(0, v) * 100).toFixed(2)}%;background:${c}" title="${esc(t || '')}"></span>`).join('')}</div>`; }
  function newsvendorChart(mu, sigma, slots, cr) {
    const w = 560, h = 150, pad = { l: 8, r: 8, t: 12, b: 22 };
    const lo = Math.max(0, mu - 3.2 * sigma), hi = mu + 3.2 * sigma;
    const X = x => pad.l + (x - lo) / (hi - lo) * (w - pad.l - pad.r);
    const pdf = x => Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
    const Y = y => h - pad.b - y * (h - pad.t - pad.b);
    let d = '', dl = '';
    for (let k = 0; k <= 80; k++) { const x = lo + (hi - lo) * k / 80; d += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(pdf(x)).toFixed(1); }
    for (let k = 0; k <= 80; k++) { const x = lo + (Math.min(slots, hi) - lo) * k / 80; dl += (k ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(pdf(x)).toFixed(1); }
    dl += ` L${X(Math.min(slots, hi)).toFixed(1)} ${Y(0)} L${X(lo)} ${Y(0)} Z`;

  }

        ${kpiBox('오토바이', F.p(T.recMoto, 1), '2시간 소형 위주', 'flat')}

        ${['밀도', '난이도', '예측 가능성', '긴급도', '신뢰도'].map((n, k) => `<div class="sbar"><span>${n}</span><span class="tr"><i style="width:${a.c[k]}%;background:${cssv(ARCH_COL[a.key])}"></i></span><span class="n">${a.c[k]}</span></div>`).join('')}
        <div class="small muted" style="margin-top:4px">추천 DSP 비중 ${F.p(dspShare, 0)} · 주력 ${ps.filter(p => p.primary === 'DSP').length >= ps.length / 2 ? 'DSP' : 'Flex'}</div></div>`;

    <div class="sec"><h2>스테이션별 계획</h2>

      ${S.planStations.map(s => `<tr><td>${esc(s.name)}</td><td class="n">${F.n(s.vol)}</td><td class="n">${F.p(s.curDSP, 0)}</td><td class="n">${F.p(s.recDSP, 0)}</td><td class="n">${F.n(s.flexBlocks)}</td><td class="n">${F.n(s.pool)}</td><td class="n">${s.surge.toFixed(2)}×</td></tr>`).join('')}

  }
  function zoneProfile(i) {

      ? `이 존에서 DSP 밴은 하루 ${F.n(routeCanCarry)}개를 나를 수 있고, Flex를 이기려면 ${F.n(ue.breakevenEff)}개면 됩니다. 그래서 DSP가 주력이고, 물량이 출렁이는 정도(D-7 예측 오차 ${F.p(x.s7, 0)})를 감안해 익일·표준 물량의 ${F.p(x.slots7 / Math.max(1, elig7), 0)}를 DSP에 확정합니다.`
      : `정차 한 번에 ${p.dwell.toFixed(1)}분(주차, 보안, 엘리베이터)이 걸려서 DSP 밴은 하루 ${F.n(routeCanCarry)}개밖에 못 나르는데, Flex를 이기려면 ${F.n(ue.breakevenEff)}개가 필요합니다. 물리적으로 이길 수 없으니 Flex가 주력이고, DSP는 기사 결원 대비 백업으로 ${F.p(S.C.dsp.backupFloor, 0)}만 남깁니다.`;

      <div class="row" style="justify-content:space-between"><div><b style="font-size:15px">${esc(c.name)}</b> <span class="small muted">· ${esc(c.T.ko)} · ${c.area.toFixed(1)}km² · ${esc(S.stations[c.station].name)}에서 ${c.dSt.toFixed(1)}km</span></div><span class="mono small faint">${c.id}</span></div>

      <h3>다섯 점수 (국가 내 백분위)</h3>
      ${[['밀도', sc.density, '시간당 배달 개수'], ['난이도', sc.difficulty, '정차당 소요 시간'], ['예측 가능성', sc.predictability, '물량 변동의 역수'], ['긴급도', sc.urgency, '당일·2시간 비중'], ['신뢰도', sc.reliability, '첫 시도 성공·주소 정확도']].map(([n, v, t]) => `<div class="sbar" title="${t}"><span>${n}</span><span class="tr"><i style="width:${v}%"></i></span><span class="n">${v}</span></div>`).join('')}
      <h3>단위 경제성 (${esc(cur())})</h3>
      <div class="tw"><table class="t"><thead><tr><th></th><th class="n">DSP 밴</th><th class="n">Flex 승용차</th><th class="n">오토바이</th></tr></thead><tbody>
        <tr><td>패키지 1개당 분</td><td class="n">${ue.mppVan.toFixed(1)}</td><td class="n">${ue.mppCar.toFixed(1)}</td><td class="n">${ue.mppMoto.toFixed(1)}</td></tr>
        <tr><td>1대가 처리하는 양</td><td class="n">${F.n(ue.pkgRoute)} / 하루</td><td class="n">${F.n(ue.pkgBlock)} / 3시간</td><td class="n">${F.n(ue.pkgMoto)} / 4시간</td></tr>

      <div class="small muted">현재</div>${mixBar([[p.curDSP, cssv('--dsp'), 'DSP'], [p.curFlex, cssv('--flex'), 'Flex'], [1 - p.curDSP - p.curFlex, cssv('--moto'), '오토바이']])}
      <div class="small muted" style="margin-top:4px">추천</div>${mixBar([[p.rec.dsp, cssv('--dsp'), 'DSP'], [p.rec.flex, cssv('--flex'), 'Flex'], [p.rec.moto, cssv('--moto'), '오토바이']])}
      <div class="row small" style="margin-top:4px"><span class="chip dsp">DSP ${F.p(p.curDSP, 0)} → ${F.p(p.rec.dsp, 0)}</span><span class="chip flex">Flex ${F.p(p.curFlex, 0)} → ${F.p(p.rec.flex, 0)}</span><span class="chip moto">오토바이 ${F.p(p.rec.moto, 1)}</span></div>
      <div class="why">${why}</div>
      <h3>8주 물량</h3>
      ${lineChart({ series: [{ pts: ser.map(r => ({ x: r.t, y: r.v })), color: cssv('--accent'), dots: ser.filter(r => r.ev).map(r => ({ x: r.t, y: r.v, color: cssv('--warn') })) }], xMin: ser[0].t, xMax: ser[ser.length - 1].t, yMax: ymax, xTicks: [0, 14, 28, 42, 56].filter(t => t >= ser[0].t).map(t => ({ x: t, l: E.fmtDate(t).split('(')[0] })) })}
      <div class="hint">요일 패턴과 노이즈를 가진 가상 기록 · 주황 점은 이벤트 날(계산 제외)</div>
    </div>`;
  }

  /* ---------- 02 Prepare ---------- */
  function rPrepare() {
    const { S, prep } = ST;
    const st = prep.stations[APP.station], sp = S.stations[APP.station];
    const flexSt = prep.flex.filter(f => f.station === APP.station);
    const W = prep.W;
    const byW = W.map((_, k) => E.sum(flexSt.map(f => f.blocks[k])));
    const maxW = Math.max(1, ...byW);
    const i = APP.sel, x = prep.cells[i], p = S.prof[i];
    const ser = p.series.slice(-28);
    const peak = prep.mult > 1;
    const ymax = Math.max(...ser.map(r => r.v), x.f7 * Math.exp(1.5 * x.s7), x.truth) * 1.1;
    return `
    <div class="sec"><div class="eyebrow">대상일 D = ${E.fmtDate(E.D)} · ${esc(SCEN[APP.scen].ko)}</div><h2>예측으로 용량을 미리 확보합니다</h2>
      <div class="tline">
        <div class="s ${peak ? 'on' : ''}"><div class="d">D-60</div>피크 임시 DSP 경로 계약, 차량 확보</div>
        <div class="s on"><div class="d">D-7</div>DSP 경로 수 확정, Flex 사전 예약 블록 공개</div>
        <div class="s on"><div class="d">D-1 밤</div>익일 주문 확정, DSP ±${Math.round(S.C.dsp.band * 100)}% 조정, Flex 보충</div>
        <div class="s on"><div class="d">D 아침</div>경로 생성, 적재, 출발</div>
        <div class="s on"><div class="d">D 낮</div>Flex 즉시 블록으로 부족분 메움</div>
      </div>
    </div>
    <div class="sec"><h2>도시 전체</h2>
      <div class="grid4">
        ${kpiBox('D-7 예측', F.n(prep.total.f7), `실제 ${F.n(prep.total.truth)}`, 'flat')}
        ${kpiBox('DSP 경로', `${prep.total.R7} → ${prep.total.routes}`, `D-7 확정 → D-1 지급${prep.total.temp ? ` · 임시 ${prep.total.temp}` : ''}`, 'flat')}
        ${kpiBox('Flex 사전 블록', F.n(prep.total.blocks), `평균 서지 ${prep.total.surge.toFixed(2)}×`, 'flat')}
        ${kpiBox('오토바이 교대', F.n(prep.total.moto), '2시간 배송용', 'flat')}
      </div>
      <p class="hint" style="margin-top:6px">Flex 가용성과 DSP 확정은 서로 영향을 줍니다. Flex 블록이 기사 풀을 넘으면 서지가 붙고, 그 가격으로 다시 계산해 DSP를 늘립니다. ${prep.iter}번 반복해 수렴했습니다.</p>
    </div>
    <div class="sec"><h2>${esc(sp.name)}</h2>
      <div class="grid4">
        ${kpiBox('DSP 경로', `${st.R7} → ${st.paidRoutes}`, `허용 ${st.Rmin}~${st.Rmax}`, 'flat')}
        ${kpiBox('Flex 블록', F.n(st.flexSched), `풀 ${F.n(st.pool)} · ${F.p(st.util7, 0)}`, st.util7 > 1 ? 'bad' : 'flat')}
        ${kpiBox('Flex 서지', st.surge7.toFixed(2) + '×', st.util7 > 0.85 ? '빠듯함' : '여유', st.util7 > 0.85 ? 'bad' : 'good')}
        ${kpiBox('오토바이', F.n(st.motoShifts) + '교대', `교대당 ${F.n(st.motoPer)}개`, 'flat')}
      </div>
      <h3>시간대별 Flex 블록 (고객이 집에 있을 시간대에 더 많이)</h3>
      ${W.map((w, k) => `<div class="sbar"><span>${w.ko} ${F.t(w.s)}</span><span class="tr"><i style="width:${byW[k] / maxW * 100}%;background:${cssv('--flex')}"></i></span><span class="n">${byW[k]}</span></div>`).join('')}
      <h3>D-1 DSP 경로 (지도에 표시)</h3>
      <div class="tw" style="max-height:260px;overflow-y:auto"><table class="t"><thead><tr><th>#</th><th>방문 존</th><th class="n">패키지</th><th class="n">시간</th><th class="n">활용률</th></tr></thead><tbody>
      ${st.routes.map((r, k) => `<tr class="click" data-route="${k}"><td class="n">${k + 1}</td><td class="small">${[...new Set(r.stops.map(s => S.cells[s.i].name))].slice(0, 3).map(esc).join(', ')}${r.stops.length > 3 ? ` 외 ${r.stops.length - 3}` : ''}</td><td class="n">${r.load}</td><td class="n">${(r.time / 60).toFixed(1)}h</td><td class="n">${F.p(r.util, 0)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint">경로는 스테이션 기준 방위각 순서로 존을 돌며 9시간 근무 안에 실을 수 있는 만큼 채우는 스윕 방식입니다. 실제 정차 순서는 기존 라우팅 시스템의 몫이고, 이 시스템은 존별로 몇 석을 DSP에 줄지를 정합니다.</p>
    </div>
    <div class="sec"><h2>${esc(S.cells[i].name)} · 예측</h2>
      ${lineChart({ series: [{ pts: ser.map(r => ({ x: r.t, y: r.v })), color: cssv('--muted'), wd: 1.3 }], band: [{ x: E.D, lo: x.f7 * Math.exp(-1.28 * x.s7), hi: x.f7 * Math.exp(1.28 * x.s7), color: cssv('--accent') }], marks: [{ x: E.D, y: x.f7, color: cssv('--accent'), label: 'D-7 예측', dx: -7, anchor: 'end', dy: -6 }, { x: E.D, y: x.truth, color: cssv('--ink'), r: 3, label: '실제', dx: -7, anchor: 'end', dy: 12 }], xMin: ser[0].t, xMax: E.D + 1, yMax: ymax, xTicks: [ser[0].t, ser[0].t + 14, E.D].map(t => ({ x: t, l: E.fmtDate(t).split('(')[0] })) })}
      <div class="grid3">${kpiBox('D-7 예측', F.n(x.f7), `오차 밴드 ±${F.p(x.s7 * 1.28, 0)}`, 'flat')}${kpiBox('D-1에 확정된 익일·표준', F.n(x.eligKnown), '주문이 이미 들어옴', 'flat')}${kpiBox('DSP 확정 좌석', F.n(x.slots7), x.prim === 'DSP' ? 'DSP 주력' : 'Flex 주력 · 백업분', 'flat')}</div>
      <p class="hint">예측은 최근 28일의 요일 보정 수준과 완만한 추세로 만든 단순 모형입니다. 실제 제안은 시계열 파운데이션 모델로 대체합니다(Gen AI Ask 탭).</p>
    </div>
    <div class="sec"><h2>프리미엄 빠른 배송 슬롯</h2>
      <p class="small muted">프리미엄은 별도 차량이 아니라 남는 용량을 파는 상품입니다. 오토바이와 Flex에 남는 자리만큼만 2시간 슬롯을 열고, 자리가 없으면 슬롯을 숨기고 오늘 저녁 무료 배송을 보여줍니다.</p>
      <div class="tw"><table class="t"><thead><tr><th>스테이션</th><th class="n">오토바이 좌석</th><th class="n">예상 2시간 주문</th><th class="n">열 수 있는 슬롯</th></tr></thead><tbody>
      ${prep.stations.map(s => { const own = prep.cells.filter(c => S.cells[c.i].station === s.i); const h2 = E.sum(own.map(c => c.f1 * S.prof[c.i].share[0])); const seats = s.motoShifts * s.motoPer; return `<tr><td>${esc(S.stations[s.i].name)}</td><td class="n">${F.n(seats)}</td><td class="n">${F.n(h2)}</td><td class="n">${F.n(Math.max(0, seats - h2 * 0.6) + E.sum(prep.flex.filter(f => f.station === s.i).map(f => f.blocks[1] * f.pkgBlock * 0.1)))}</td></tr>`; }).join('')}
      </tbody></table></div>
    </div>`;
  }

  /* ---------- 03 Assign ---------- */
  function rAssign() {
    const { S } = ST;
    const sim = APP.dotPolicy === 'fw' ? ST.fw : ST.base;
    const pk = APP.dotPolicy === 'fw' ? ST.pk : ST.pkB;
    const now = APP.clock;
    const cnt = [0, 0, 0, 0, 0]; let fail = 0, done = 0;
    pk.forEach(p => { const at = p.pr >= 2 ? 360 : Math.max(360, p.t); if (at > now) return; const r = sim.res[p.id]; cnt[r.ch]++; });
    const sn = sim.snaps.find(s => s.h === Math.min(23, Math.max(6, Math.floor(now / 60)))) || sim.snaps[0];
    const dspLeft = E.sum(Object.values(sn.dspLeft));
    const flexLeft = sim.W.map((_, k) => E.sum(sim.flexCap.map((f, j) => Math.max(0, sn.cap[j][k] - sn.used[j][k]))));
    const pkById = ST.byId[APP.dotPolicy] || (ST.byId[APP.dotPolicy] = new Map(pk.map(p => [p.id, p])));
    const logIds = sim.log.filter(id => { const p = pkById.get(id); return p && Math.max(360, p.t) <= now; }).slice(-60).reverse();
    const pick = APP.pick != null ? pkById.get(APP.pick) : null;
    return `
    <div class="sec"><div class="eyebrow">${E.fmtDate(E.D)} · ${esc(SCEN[APP.scen].ko)} · 지도의 점 = 패키지 ${pk.length > 9000 ? '(일부 표본)' : ''}</div><h2>패키지마다 여섯 단계로 정합니다</h2>
      <div class="row" style="margin-bottom:8px">
        <button class="btn primary" id="playBtn">${APP.playing ? '일시정지' : '재생'}</button>
        <div class="seg" id="speedSeg">${[[30, '1×'], [120, '4×'], [480, '16×']].map(([v, l]) => `<button data-speed="${v}" class="${APP.speed === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="seg" id="polSeg"><button data-pol="fw" class="${APP.dotPolicy === 'fw' ? 'on' : ''}">프레임워크</button><button data-pol="base" class="${APP.dotPolicy === 'base' ? 'on' : ''}">현재 방식</button></div>
      </div>
      <input type="range" id="clockRange" min="360" max="1380" step="5" value="${now}" style="width:100%" aria-label="시각">
      <div class="row small mono faint" style="justify-content:space-between"><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>
    </div>
    <div class="sec"><h2>${F.t(now)} 현재 상태 <span class="small muted">(Input의 두 번째 종류)</span></h2>
      <div class="grid4">${CHN.slice(0, 4).map((n, k) => kpiBox(n, F.n(cnt[k]), k === 0 ? `남은 DSP 좌석 ${F.n(dspLeft)}` : k === 1 ? `남은 Flex 좌석 ${F.n(E.sum(flexLeft))}` : k === 2 ? `오토바이 사용 ${F.n(E.sum(sn.moto))}` : `지연 ${F.n(cnt[4])}건`, 'flat')).join('')}</div>
      <h3>시간대별 남은 Flex 좌석</h3>
      ${sim.W.map((w, k) => `<div class="sbar"><span>${w.ko}</span><span class="tr"><i style="width:${Math.min(100, flexLeft[k] / Math.max(1, ...flexLeft) * 100)}%;background:${cssv('--flex')}"></i></span><span class="n">${F.n(flexLeft[k])}</span></div>`).join('')}
      <p class="hint">즉시 블록 추가 ${F.n(E.sum(sn.inst))}개 (지금까지)</p>
    </div>
    <div class="sec"><h2>선택한 패키지</h2>
      ${pick ? traceCard(pick, sim) : '<p class="muted small">지도의 점이나 아래 기록을 누르면 그 패키지가 어떤 단계를 거쳐 배정됐는지 보여줍니다.</p>'}
    </div>
    <div class="sec"><h2>결정 기록</h2>
      <div class="log" id="logBox">${logIds.map(id => { const p = pkById.get(id), r = sim.res[id]; const c = S.cells[p.i]; const w = sim.W[r.w]; return `<div data-pk="${id}"><span class="tm">${F.t(Math.max(360, p.t))}</span><span>${esc(c.name)} · ${E.PROMISE[p.pr]} → <span class="chip ${CHK[r.ch]}">${CHN[r.ch]}</span> ${w ? w.ko : ''}${r.tr && r.tr.some(t => t[0] === '레버') ? ' <span class="chip warn">레버</span>' : ''}</span></div>`; }).join('') || '<div class="muted small">아직 기록이 없습니다. 시계를 앞으로 옮겨 보세요.</div>'}</div>
    </div>
    <div class="sec"><h2>가상 패키지 넣어보기</h2>
      <p class="small muted">${esc(S.cells[APP.sel].name)} 존에 지금 시각(${F.t(now)}) 주문이 들어오면 어떻게 배정될까요? 그 시각의 남은 좌석으로 계산합니다.</p>
      <div class="row">
        <select id="wfPr">${E.PROMISE.map((n, k) => `<option value="${k}" ${k === 1 ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <select id="wfSz"><option value="0">소형</option><option value="1">중형</option><option value="2">대형</option></select>
        <label class="small"><input type="checkbox" id="wfCod"> 착불</label>
        <button class="btn" id="wfGo">결정 흐름 실행</button>
      </div>
      <div id="wfOut" style="margin-top:8px"></div>
    </div>
    <details class="ex"><summary>여섯 단계</summary>
      <ol class="steps">
        <li><b>약속으로 거르기</b>2시간이면 오토바이·Flex만. 당일은 Flex·오토바이(새벽 주문은 DSP 빈자리도). 익일·표준은 전부.</li>
        <li><b>크기로 거르기</b>대형은 오토바이 제외.</li>
        <li><b>성공 가능성으로 시간대 정렬</b>이 존의 시간대별 부재율로 정렬. 타워는 저녁, 산업 지역은 낮.</li>
        <li><b>한계비용 비교</b>이미 돈을 낸 DSP 좌석과 Flex 블록의 빈자리는 한계비용이 거의 0. 여기에 실패 확률 × 재배송 비용을 더해 가장 싼 것.</li>
        <li><b>자리가 없으면 레버</b>Flex 즉시 블록(서지 반영) 또는 고객에게 다른 시간대 제안(크레딧) 중 기대비용이 낮은 쪽.</li>
        <li><b>기록</b>결과가 Attempt 기록으로 쌓여 Learn으로 갑니다.</li>
      </ol>
    </details>`;
  }
  function traceCard(p, sim) {
    const S = ST.S, r = sim.res[p.id], c = S.cells[p.i];
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>#${p.id} · ${esc(c.name)}</b><span class="chip ${CHK[r.ch]}">${CHN[r.ch]}</span></div>
      <div class="small muted">${E.PROMISE[p.pr]} · ${['소형', '중형', '대형'][p.sz]}${p.cod ? ' · 착불' : ''} · 주문 ${p.t < 0 ? '전날 ' + F.t(p.t + 1440) : F.t(p.t)}</div>
      <ol class="steps">${(r.tr || []).map(([k, t]) => `<li class="${k === '선택' || k === '결과' ? 'final' : ''}"><b>${esc(k)}</b>${esc(t)}</li>`).join('')}</ol></div>`;
  }

  /* ---------- 04 Learn ---------- */
  function rLearn() {
    const { S, fw, base, learn } = ST;
    const k = fw.kpi, b = base.kpi;
    const eg = APP.city === 'cairo';
    const G = { onTime: eg ? 0.9 : 0.98, fas: eg ? 0.9 : 0.98, dspUtil: 0.9, flexUtil: 0.8, inst: 0.1 };
    const row = (n, a, f, goal, good, fmtv) => { const ok = good(f); return `<tr><td>${n}</td><td class="n">${fmtv(a)}</td><td class="n"><b>${fmtv(f)}</b></td><td class="n">${goal}</td><td><span class="chip ${ok ? 'ok' : 'warn'}">${ok ? '충족' : '확인'}</span></td></tr>`; };
    const instR = x => x.instBlocks / Math.max(1, x.blocks);
    const ups = learn.rows.map(r => { const p = S.prof[r.i]; const dn = r.nhNew.map((v, j) => v - p.nhW[j]); const j = dn.reduce((a, v, q) => Math.abs(v) > Math.abs(dn[a]) ? q : a, 0); return { r, p, j, d: dn[j] }; }).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 6);
    const tr = APP.trade;
    return `
    <div class="sec"><div class="eyebrow">매일 밤 · ${E.fmtDate(E.D)} 결과</div><h2>비용과 고객 경험을 나란히 봅니다</h2>
      <div class="tw"><table class="t"><thead><tr><th>지표</th><th class="n">현재</th><th class="n">프레임워크</th><th class="n">가드레일</th><th></th></tr></thead><tbody>
        ${row('패키지당 비용 (' + cur() + ')', b.cpp, k.cpp, '줄이기', v => v < b.cpp, v => v.toFixed(2))}
        ${row('성공 배송당 비용', b.cpsd, k.cpsd, '줄이기', v => v < b.cpsd, v => v.toFixed(2))}
        ${row('약속 준수율', b.onTime, k.onTime, '≥ ' + F.p(G.onTime, 0), v => v >= G.onTime, v => F.p(v))}
        ${row('첫 시도 성공률', b.fas, k.fas, '≥ ' + F.p(G.fas, 1), v => v >= G.fas, v => F.p(v))}
        ${row('DSP 경로 시간 활용률', b.dspUtil, k.dspUtil, '≥ 90%', v => v >= G.dspUtil, v => F.p(v, 0))}
        ${row('Flex 블록 좌석 활용률', b.flexUtil, k.flexUtil, '≥ 80%', v => v >= G.flexUtil, v => F.p(v, 0))}
        ${row('즉시 블록 비율', instR(b), instR(k), '≤ 10%', v => v <= G.inst, v => F.p(v, 1))}
        ${row('고객 조정·지연 건수', b.shaped + b.late, k.shaped + k.late, '최소화', v => v <= b.shaped + b.late, v => F.n(v))}
      </tbody></table></div>
      <p class="hint">원칙: 비용은 가드레일 안에서만 줄입니다. 약속 준수율과 첫 시도 성공률이 선 아래로 내려가면 비용 절감보다 회복이 우선입니다.</p>
